
name: Notarize Prebuilt MacInfo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notarize:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract prebuilt app
        run: |
          mkdir -p output
          ditto -x -k releases/MacInfo.zip output

      - name: Verify Developer ID signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            output/MacInfo.app
          codesign -dv --verbose=4 output/MacInfo.app

      - name: Configure Apple API key
        env:
          API_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          printf '%s\n' "$API_KEY" \
            > "$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"

      - name: Submit to Apple Notary Service
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          xcrun notarytool submit releases/MacInfo.zip \
            --key "$RUNNER_TEMP/AuthKey_${KEY_ID}.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait \
            --output-format json \
            | tee notarization.json

          python3 -c '
          import json
          with open("notarization.json") as f:
              result = json.load(f)
          if result.get("status") != "Accepted":
              raise SystemExit("Notarization not accepted")
          '

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple output/MacInfo.app
          xcrun stapler validate output/MacInfo.app

      - name: Package notarized application
        run: |
          ditto -c -k --keepParent \
            output/MacInfo.app \
            MacInfo-notarized.zip

      - name: Upload notarized application
        uses: actions/upload-artifact@v4
        with:
          name: MacInfo-notarized
          path: MacInfo-notarized.zip

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notarization-diagnostics
          path: notarization.json
          if-no-files-found: ignore
